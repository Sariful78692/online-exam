<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Add Question</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box;
        }
        #message { margin-top: 15px; font-weight: bold; color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h1>অ্যাডমিন প্যানেল - প্রশ্ন যুক্ত করুন</h1>
        <form id="add-question-form">
            <div class="form-group">
                <label>বিষয় (Subject):</label>
                <input type="text" id="subject" required placeholder="যেমন: Math, Physics">
            </div>
            <div class="form-group">
                <label>প্রশ্ন (Question):</label>
                <textarea id="question" required rows="3" placeholder="প্রশ্ন লিখুন (ইকুয়েশন হলে $$x^2$$ এভাবে)"></textarea>
            </div>
            <div class="form-group">
                <label>Option A:</label><input type="text" id="opt_a" required>
            </div>
            <div class="form-group">
                <label>Option B:</label><input type="text" id="opt_b" required>
            </div>
            <div class="form-group">
                <label>Option C:</label><input type="text" id="opt_c" required>
            </div>
            <div class="form-group">
                <label>Option D:</label><input type="text" id="opt_d" required>
            </div>
            <div class="form-group">
                <label>সঠিক উত্তর (Correct Answer):</label>
                <select id="correct_answer" required>
                    <option value="">-- নির্বাচন করুন --</option>
                    <option value="A">A</option><option value="B">B</option>
                    <option value="C">C</option><option value="D">D</option>
                </select>
            </div>
            <div class="form-group">
                <label>সঠিক উত্তরের মার্ক (Mark):</label>
                <input type="number" id="mark" step="any" value="1" required>
            </div>
            <div class="form-group">
                <label>নেগেটিভ মার্ক (Negative Mark):</label>
                <input type="number" id="negative_mark" step="any" value="0.25" required>
            </div>
            <button type="submit" class="btn-submit" id="submit-btn">প্রশ্ন সেভ করুন</button>
            <div id="message"></div>
        </form>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
