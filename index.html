<!DOCTYPE html>
<html lang="bn">
<head>
        <link rel="icon" type="image/png" href="assets/exam.png">
<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Online Exam</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/student-login.css">
    <link rel="stylesheet" href="css/responsive.css">
<style>.site-copyright-footer{position:fixed;z-index:1200;left:0;right:0;bottom:0;width:100%;padding:6px 12px;border-top:1px solid rgba(139,92,246,.2);background:rgba(255,255,255,.97);box-shadow:0 -3px 12px rgba(31,41,55,.09);color:#4b5563;font:500 11px/1.2 Inter,Arial,sans-serif;letter-spacing:.2px;text-align:center;white-space:nowrap;backdrop-filter:blur(8px);pointer-events:none}@media(max-width:520px){.site-copyright-footer{padding:10px 12px;font-size:10px;white-space:normal}}
</style>
<style>body:has(.sidebar) .site-copyright-footer{left:260px;width:calc(100% - 260px)}@media(max-width:760px){body:has(.sidebar) .site-copyright-footer{left:0;width:100%}}@media(max-width:520px){.site-copyright-footer{padding:6px 10px;font-size:10px}}</style>
    <link rel="stylesheet" href="css/page-loader.css">
</head>
<body>
    <script src="js/page-loader.js"></script>
    <div class="container login-container">
        <h2 style="text-align: center;">Student login</h2>
        <form id="login-form">
            <div class="form-group floating-field">
                <input type="text" id="login_id" placeholder=" " autocomplete="username" required>
                <label for="login_id">Student ID</label>
            </div>
            <div class="form-group floating-field">
                <input type="password" id="login_pass" placeholder=" " autocomplete="current-password" required>
                <label for="login_pass">Password</label>
            </div>
            <button type="submit" class="btn-submit" id="login-btn">Login Here</button>
            <p id="login-msg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
        </form>
        <form id="register-form">
            <div class="form-group floating-field"><input type="text" id="register-name" placeholder=" " autocomplete="name" required><label for="register-name">Full Name</label></div>
            <div class="form-group floating-field"><input type="tel" id="register-mobile" placeholder=" " inputmode="tel" autocomplete="tel" required><label for="register-mobile">Mobile Number</label></div>
            <div class="form-group floating-field"><input type="email" id="register-email" placeholder=" " autocomplete="email" required><label for="register-email">Email Address</label></div>
            <div class="form-group floating-field"><input type="password" id="register-password" placeholder=" " minlength="4" autocomplete="new-password" required><label for="register-password">Create Password</label></div>
            <button type="submit" class="btn-submit" id="register-btn">Create Account</button>
            <p id="register-msg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
        </form>
        <p class="auth-switch"><span id="auth-switch-prompt">New student?</span> <button type="button" id="auth-switch-btn">Register here</button></p>
    </div>

    <script src="js/api.js?v=20260930-toast1"></script>
    <script src="js/login.js?v=20260930-toast1"></script>
<footer class="site-copyright-footer">Copyright© 2026 Sariful Islam Shake. All rights reserved.</footer>
</body>
</html>
