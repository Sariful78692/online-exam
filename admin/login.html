<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#15152b">
    <title>Admin Login - Sariful Tech</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/admin-login.css">
    <link rel="stylesheet" href="../css/responsive.css">
<style>.site-copyright-footer{position:fixed;z-index:1200;left:0;right:0;bottom:0;width:100%;padding:6px 12px;border-top:1px solid rgba(139,92,246,.2);background:rgba(255,255,255,.97);box-shadow:0 -3px 12px rgba(31,41,55,.09);color:#4b5563;font:500 11px/1.2 Inter,Arial,sans-serif;letter-spacing:.2px;text-align:center;white-space:nowrap;backdrop-filter:blur(8px);pointer-events:none}@media(max-width:520px){.site-copyright-footer{padding:10px 12px;font-size:10px;white-space:normal}}
</style>
<style>body:has(.sidebar) .site-copyright-footer{left:260px;width:calc(100% - 260px)}@media(max-width:760px){body:has(.sidebar) .site-copyright-footer{left:0;width:100%}}@media(max-width:520px){.site-copyright-footer{padding:6px 10px;font-size:10px}}</style>
</head>
<body>
    <div class="ambient one"></div><div class="ambient two"></div>
    <main class="login-card">
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-graduation-cap"></i></div>
            <div class="brand-copy"><small>Online Exam</small><strong>Sariful Tech</strong></div>
        </div>
        <h1>Admin sign in</h1>
        <p class="subtitle">Sign in to manage exams, students, questions, and results.</p>
        <form id="admin-login-form">
            <div class="field">
                <label for="admin-id">Admin ID</label>
                <div class="input-wrap"><i class="fa-solid fa-user leading"></i><input id="admin-id" name="adminId" type="text" placeholder="Enter admin ID" autocomplete="username" required></div>
            </div>
            <div class="field">
                <label for="admin-password">Password</label>
                <div class="input-wrap"><i class="fa-solid fa-lock leading"></i><input id="admin-password" name="password" type="password" placeholder="Enter password" autocomplete="current-password" required><button type="button" class="toggle-password" id="toggle-password" aria-label="Show password"><i class="fa-regular fa-eye"></i></button></div>
            </div>
            <button class="submit" type="submit" id="admin-login-button"><span>Sign in to dashboard</span><i class="fa-solid fa-arrow-right"></i></button>
            <p class="message" id="admin-login-message" role="status" aria-live="polite"></p>
        </form>
        <div class="secure-note"><i class="fa-solid fa-shield-halved"></i><span>Administrator access</span></div>
    </main>
    <script src="../js/admin-login.js"></script>
<footer class="site-copyright-footer">Copyright© 2026 Sariful Islam Shake. All rights reserved.</footer>
</body>
</html>
