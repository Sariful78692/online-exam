<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Login - Online Exam</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* লগিন বক্সের সাইজ ছোট করার জন্য */
        .login-container { max-width: 400px; margin: 80px auto; }
    </style>
</head>
<body>
    <div class="container login-container">
        <h2 style="text-align: center;">স্টুডেন্ট লগিন</h2>
        <form id="login-form">
            <div class="form-group">
                <label>স্টুডেন্ট আইডি (ID):</label>
                <input type="text" id="login_id" placeholder="আপনার আইডি দিন" required>
            </div>
            <div class="form-group">
                <label>পাসওয়ার্ড:</label>
                <input type="password" id="login_pass" placeholder="পাসওয়ার্ড দিন" required>
            </div>
            <button type="submit" class="btn-submit" id="login-btn">লগিন করুন</button>
            <p id="login-msg" style="text-align: center; margin-top: 15px; font-weight: bold;"></p>
        </form>
    </div>

    <script src="js/api.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
